<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Record — Super Typhoon Records</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="site-header">

            <a href="index.html" class="site-title">
                SUPER TYPHOON RECORDS
            </a>

            <nav aria-label="Main navigation">
                <ul>
                    <li>
                        <a href="index.html">Shop</a>
                    </li>
                    <li>
                        <a href="about.html">About</a>
                    </li>
                    <li>
                        <a href="contact.html">Contact</a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>


    <main>

        <section class="record-page">

            <figure>
                <img id="record-image" src="" alt="">
            </figure>


            <article class="record-info">

                <p id="record-artist"></p>

                <h2 id="record-name"></h2>

                <p id="record-price"></p>


                <dl>

                    <dt>Year</dt>
                    <dd id="record-year"></dd>

                    <dt>Genre</dt>
                    <dd id="record-genre"></dd>

                </dl>


                <button type="button">
                    Add to Cart
                </button>


                <p>
                    <a href="index.html">← Back to Shop</a>
                </p>

            </article>

        </section>

    </main>


    <footer>
        <p>SUPER TYPHOON RECORDS</p>
    </footer>


    <script src="record.js"></script>

</body>
</html>
